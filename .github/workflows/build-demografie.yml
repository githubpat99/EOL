name: Demografie JSON aus CSV erstellen

on:
  push:
    paths:
      - 'demografie_teamleiter.csv'
      - 'scripts/csv-to-json.ps1'
      - '.github/workflows/build-demografie.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-json:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: JSON aus CSV erzeugen
        shell: pwsh
        run: ./scripts/csv-to-json.ps1

      - name: Erzeugte JSON committen
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demografie.json
          if (git diff --cached --quiet) {
            Write-Host 'demografie.json ist bereits aktuell.'
          } else {
            git commit -m 'Build demografie.json from teamleiter CSV'
            git push
          }
